services:
  - type: web
    name: receipt-backend-james
    runtime: node
    rootDir: backend
    plan: 0.5c-512mb
    region: virginia
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run migrate:prod
    startCommand: npm start
    healthCheckPath: /api/v1/ingest/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: INGEST_API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: receipt-postgres-james
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://studio-riscos-digitais.vercel.app
      - key: DUPLICATE_WINDOW_MS
        value: 5000
      - key: FLUSH_INTERVAL_MS
        value: 10000

databases:
  - name: receipt-postgres-james
    plan: 0.1c-256mb
    region: virginia
    databaseName: studio_rj
    user: studio_rj
    diskSizeGB: 1
